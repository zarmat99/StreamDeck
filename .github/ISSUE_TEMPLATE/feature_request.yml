name: Feature request
description: Propose a scoped product or developer improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: The request does not contain credentials or private data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user outcome, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Desktop UI
        - OBS integration
        - Serial protocol
        - Reference hardware or firmware
        - Automations
        - Packaging, documentation, or CI
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Note any effect on configuration, protocol, firmware, security, privacy, or accessibility.
