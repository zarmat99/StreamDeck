name: Release candidate

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build, optionally sign, and draft release
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,firmware]"
          python -m pip check

      - name: Validate version and quality gates
        run: |
          python scripts/check_release.py "$env:RELEASE_TAG"
          python scripts/scan_secrets.py
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m pytest --cov=src --cov-report=term-missing
          python -m pip_audit --strict --requirement requirements.txt

      - name: Build desktop and firmware artifacts
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          python -m PyInstaller --clean --noconfirm streamdeck_control.spec
          python scripts/check_pyinstaller.py
          pio run -d firmware -e uno_active_high
          pio run -d firmware -e uno_internal_pullup

      - name: Validate signing secret pair
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
              throw "Both Windows signing secrets must be configured together."
          }
          "enabled=$($hasCertificate.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Authenticode-sign executables
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          try {
              $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
              [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
              $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                  Sort-Object FullName |
                  Select-Object -Last 1
              if (-not $signTool) {
                  throw "Windows SDK signtool.exe was not found."
              }
              $executables = Get-ChildItem "dist\StreamDeck Control" -Filter *.exe -Recurse
              if (-not $executables) {
                  throw "No executable was produced for signing."
              }
              foreach ($executable in $executables) {
                  & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $executable.FullName
                  if ($LASTEXITCODE -ne 0) {
                      throw "signtool failed for $($executable.Name)."
                  }
              }
          }
          finally {
              if (Test-Path $certificatePath) {
                  Remove-Item -LiteralPath $certificatePath -Force
              }
          }

      - name: Stage release and write hashes
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $stage = Join-Path $PWD "release-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $signed = "${{ steps.signing.outputs.enabled }}" -eq "true"
          if ($signed) {
              "SIGNED: executables carry an Authenticode signature; verify publisher and timestamp." | Set-Content (Join-Path $stage "SIGNING-STATUS.txt")
          }
          else {
              "UNSIGNED: signing secrets were not configured; this is not a signed production artifact." | Set-Content (Join-Path $stage "SIGNING-STATUS.txt")
          }

          Compress-Archive -Path "dist\StreamDeck Control\*" -DestinationPath (Join-Path $stage "StreamDeck-Control-$version-windows-x64.zip")
          Copy-Item "dist\*.whl", "dist\*.tar.gz" -Destination $stage
          Copy-Item "firmware\.pio\build\uno_active_high\firmware.hex" (Join-Path $stage "firmware-$version-uno-active-high.hex")
          Copy-Item "firmware\.pio\build\uno_internal_pullup\firmware.hex" (Join-Path $stage "firmware-$version-uno-internal-pullup.hex")
          python -m pip list --format=freeze | Set-Content (Join-Path $stage "BUILD-ENVIRONMENT.txt")
          $env:GITHUB_SHA | Set-Content (Join-Path $stage "SOURCE-COMMIT.txt")

          $hashLines = Get-ChildItem $stage -File |
              Sort-Object Name |
              ForEach-Object { "{0} *{1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $hashLines | Set-Content (Join-Path $stage "SHA256SUMS.txt")

      - name: Upload immutable candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-stage/
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release-stage -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG $files --verify-tag --draft --generate-notes --title "StreamDeck Control $env:RELEASE_TAG"
