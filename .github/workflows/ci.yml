name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Scan repository for common secrets
        if: matrix.python-version == '3.13'
        run: python scripts/scan_secrets.py

      - name: Lint and type-check
        if: matrix.python-version == '3.13'
        run: |
          python scripts/check_release.py
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Run tests with branch coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Verify installed package namespaces
        run: >-
          python -c "import streamdeck_control;
          import streamdeck_control.app;
          import streamdeck_control.hardware.serial_controller;
          import streamdeck_control.obs.obs_controller;
          import streamdeck_control.scripts.scripting;
          import streamdeck_control.ui.pages.connection_page;
          import streamdeck_control.utils.config_manager;
          print(streamdeck_control.__version__)"

      - name: Upload coverage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: Runtime dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Audit resolved runtime environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --strict --requirement requirements.txt

  package:
    name: Build distributions
    needs: [test, audit]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          $wheel = (Get-ChildItem "dist\*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "No wheel was produced." }
          python -m pip install --force-reinstall --no-deps $wheel
          Set-Location $env:RUNNER_TEMP
          python -c "import streamdeck_control; import streamdeck_control.app; print(streamdeck_control.__version__)"
      - name: Build Windows application directory
        run: |
          python -m PyInstaller --clean --noconfirm streamdeck_control.spec
          python scripts/check_pyinstaller.py
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-control-windows
          path: dist/StreamDeck Control/
          if-no-files-found: error
          retention-days: 14
