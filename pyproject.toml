[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamdeck-control"
dynamic = ["version"]
description = "Windows control-surface application for OBS Studio and local desktop automations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
  { name = "StreamDeck Control contributors" },
]
keywords = ["obs", "control-surface", "serial", "arduino", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "customtkinter>=5.2,<6",
  "pyserial>=3.5,<4",
  "obs-websocket-py>=1.0,<2",
  "pyautogui>=0.9.54,<1",
  "keyring>=24,<27",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7,<8",
  "mypy>=1.15,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "pyinstaller>=6.12,<7",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.15.21,<1",
  "setuptools>=77,<84",
  "twine>=6,<7",
  "wheel>=0.45,<1",
]
firmware = [
  "platformio>=6.1,<7",
]

[project.scripts]
streamdeck-control = "streamdeck_control.app:run"

[project.urls]
Repository = "https://github.com/zarmat99/StreamDeck"
Issues = "https://github.com/zarmat99/StreamDeck/issues"
Security = "https://github.com/zarmat99/StreamDeck/security/advisories/new"

[tool.setuptools]
include-package-data = true
package-dir = { streamdeck_control = "src" }
packages = [
  "streamdeck_control",
  "streamdeck_control.hardware",
  "streamdeck_control.obs",
  "streamdeck_control.scripts",
  "streamdeck_control.ui",
  "streamdeck_control.ui.pages",
  "streamdeck_control.utils",
]

[tool.setuptools.dynamic]
version = { attr = "streamdeck_control.version.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
minversion = "8.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 35
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["firmware/.pio"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
no_implicit_optional = false
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = false
